<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Value Chain</title>
<style>
  :root{
    --bg:#10131f; --bg2:#171b2c; --panel:#1e2338; --panel2:#262d48;
    --ink:#f2f4fd; --muted:#a8b0d2; --faint:#767ea6;
    --gold:#ffcf5c; --gold-dim:#d9a72f;
    --teal:#4ee0cd; --bridge:#66d9ff; --bond:#ffab7d;
    --line:#333b5e; --good:#6ee39a; --bad:#ff7d8e;
    --card:#f7f3e9; --card-ink:#1b1e29;
    --radius:16px; --shadow:0 12px 34px rgba(0,0,0,.4);
    --z-nordic:#66d9ff; --z-anglo:#9d8dff; --z-latin:#ffab7d; --z-cath:#ffcf5c;
    --z-orth:#cd7dff; --z-afrme:#6ee39a; --z-conf:#ff7dab; --z-sasia:#ecc45f; --z-global:#a8b0d2;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 700px at 70% -10%,#232a52 0%,var(--bg) 55%);color:var(--ink);min-height:100vh;font-size:15px}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:11px;color:var(--ink);background:var(--panel2);padding:11px 16px;font-size:14px;font-weight:700;transition:.12s;min-height:44px}
  button:hover{filter:brightness(1.15)}
  button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
  button:disabled{opacity:.4;cursor:not-allowed}
  .btn-gold{background:linear-gradient(180deg,var(--gold),var(--gold-dim));color:#2a2005}
  .btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--muted)}

  header{display:flex;align-items:center;gap:20px;padding:12px 20px;border-bottom:1px solid var(--line);background:rgba(16,19,31,.8);backdrop-filter:blur(8px);position:sticky;top:0;z-index:40;flex-wrap:wrap}
  .logo{font-weight:900;font-size:21px;letter-spacing:.3px}
  .logo b{color:var(--gold)}
  .logo small{display:block;font-size:10px;font-weight:700;color:var(--faint);letter-spacing:1.4px;text-transform:uppercase}
  .stats{display:flex;gap:24px}
  .stat{line-height:1.1}
  .stat .n{font-size:25px;font-weight:900;color:var(--gold)}
  .stat .l{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:1px;font-weight:700}
  header .spacer{flex:1}

  .layout{display:grid;grid-template-columns:1fr 330px;min-height:calc(100vh - 62px)}
  @media(max-width:920px){.layout{grid-template-columns:1fr}}

  .board-wrap{padding:16px 20px 250px;overflow:auto}
  .coach{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,rgba(78,224,205,.14),rgba(78,224,205,.02));border:1.5px solid rgba(78,224,205,.35);border-radius:14px;padding:12px 16px;margin-bottom:16px;font-size:15px;line-height:1.45}
  .coach .ico{font-size:24px;flex-shrink:0}
  .coach b{color:var(--teal)}
  .chains{display:flex;flex-direction:column;gap:16px}

  .chain{display:flex;align-items:center;gap:2px;flex-wrap:nowrap;overflow-x:auto;padding:12px;background:linear-gradient(180deg,rgba(255,255,255,.025),transparent);border:1px solid var(--line);border-radius:var(--radius);min-height:186px}
  .chain::-webkit-scrollbar{height:9px}
  .chain::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

  .card{position:relative;width:140px;min-width:140px;background:var(--card);color:var(--card-ink);border-radius:13px;padding:10px;box-shadow:var(--shadow);border-left:6px solid var(--z-global);user-select:none}
  .card .top{display:flex;align-items:flex-start;justify-content:space-between;gap:4px}
  .card .job-ico{font-size:23px;line-height:1}
  .card .who{font-weight:850;font-size:15px;line-height:1.1;margin-top:6px;color:#1b1e29}
  .card .who span{font-weight:600;color:#6a6553;font-size:12.5px}
  .card .place{font-size:11.5px;color:#4d4a3d;margin-top:3px;line-height:1.25}
  .card .job{font-size:11.5px;color:#6a6553;margin-top:2px;line-height:1.25;min-height:28px}
  .card .grouptag{display:inline-block;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:2px 7px;border-radius:20px;margin-top:6px;background:#e3dcc8;color:#5c5741}
  .card .grouptag.huge{background:#cfd6ea;color:#3f4763}
  .card .sig{margin-top:7px;font-size:10.5px;color:#5c5847;border-top:1px dashed #cdc4ae;padding-top:6px;line-height:1.3}
  .card .sig b{color:#1b1e29}
  .card.in-hand{cursor:pointer;transition:transform .1s}
  .card.in-hand:hover{transform:translateY(-7px)}
  .card.selected{outline:4px solid var(--gold);outline-offset:2px;transform:translateY(-9px)}
  .card.dim{opacity:.42}

  .link{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:86px;padding:0 5px}
  .link .wire{width:100%;height:3px;background:repeating-linear-gradient(90deg,var(--gold) 0 7px,transparent 7px 13px)}
  .link .chip{margin:6px 0;background:var(--panel2);border:1.5px solid var(--gold-dim);border-radius:20px;padding:5px 10px;text-align:center;white-space:nowrap}
  .link .chip .d{font-size:10px;color:var(--muted);font-weight:700}
  .link .chip .p{font-size:17px;font-weight:900;color:var(--gold)}
  .link.bridge .chip{border-color:var(--bridge);box-shadow:0 0 14px rgba(102,217,255,.35)}
  .link.bridge .chip .p{color:var(--bridge)}
  .link.bond .chip{border-color:var(--bond)}
  .link.bond .chip .p{color:var(--bond)}

  .slot{width:84px;min-width:84px;height:160px;border:3px dashed var(--teal);border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;background:rgba(78,224,205,.09);color:var(--teal);font-size:11.5px;font-weight:700;text-align:center;transition:.12s}
  .slot:hover{background:rgba(78,224,205,.2);transform:scale(1.04)}
  .slot .plus{font-size:26px;line-height:1}
  .slot .best{font-weight:900;font-size:16px}
  .newchain{width:150px;min-height:160px;border:3px dashed var(--line);border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--faint);font-size:12.5px;font-weight:700;cursor:pointer;gap:6px;text-align:center;padding:8px}
  .newchain.active{border-color:var(--teal);color:var(--teal);background:rgba(78,224,205,.09)}
  .newchain .plus{font-size:30px}

  .picker{position:fixed;z-index:60;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px;min-width:290px;max-width:340px;max-height:70vh;overflow:auto}
  .picker h4{margin:4px 8px 10px;font-size:13px;color:var(--ink);font-weight:800;line-height:1.35}
  .picker h4 small{display:block;color:var(--faint);font-weight:600;font-size:11px;margin-top:3px}
  .picker .opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 11px;border-radius:10px;cursor:pointer;min-height:44px}
  .picker .opt:hover{background:var(--panel2)}
  .picker .opt .dn{font-size:13px;font-weight:700;line-height:1.3}
  .picker .opt .dn small{display:block;color:var(--faint);font-size:10.5px;font-weight:600;margin-top:2px}
  .picker .opt .pv{font-weight:900;color:var(--gold);font-size:19px;flex-shrink:0}
  .picker .opt.bridge .pv{color:var(--bridge)}
  .picker .opt.bond .pv{color:var(--bond)}

  .side{border-left:1px solid var(--line);background:var(--bg2);padding:18px;overflow:auto}
  @media(max-width:920px){.side{border-left:none;border-top:1px solid var(--line)}}
  .side .p-head{font-size:19px;font-weight:900;margin:0}
  .side .p-head span{font-weight:600;color:var(--muted);font-size:15px}
  .side .p-sub{color:var(--muted);font-size:13px;margin:5px 0 2px;line-height:1.45}
  .side .zone-tag{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;background:var(--panel2);color:var(--muted);margin:9px 0 4px;text-transform:uppercase;letter-spacing:.5px}
  .side .empty{color:var(--faint);font-size:14px;line-height:1.6}
  .grp{margin-top:14px}
  .grp h5{margin:0 0 7px;font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--faint);font-weight:800}
  .grp .item{font-size:13px;line-height:1.4;padding:5px 0;color:var(--ink);display:flex;gap:8px}
  .grp .item i{font-style:normal;flex-shrink:0}
  .allbtn{margin-top:14px;width:100%}
  .stancebar{margin:8px 0}
  .stancebar .top{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;margin-bottom:4px}
  .stancebar .top .lab{color:var(--muted);line-height:1.3}
  .stancebar .top .val{color:var(--ink);font-weight:800;flex-shrink:0}
  .stancebar .track{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden}
  .stancebar .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--teal),var(--gold))}
  .hot{font-size:9px;font-weight:800;padding:1px 6px;border-radius:6px;margin-left:5px;background:rgba(255,125,142,.18);color:var(--bad)}
  .warm{font-size:9px;font-weight:800;padding:1px 6px;border-radius:6px;margin-left:5px;background:rgba(110,227,154,.16);color:var(--good)}

  .tray{position:fixed;bottom:0;left:0;right:330px;background:linear-gradient(180deg,rgba(23,27,44,.5),var(--bg2) 42%);border-top:1px solid var(--line);padding:10px 16px 14px;z-index:30;backdrop-filter:blur(10px)}
  @media(max-width:920px){.tray{right:0}}
  .tray .row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .tray .label{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:1px;font-weight:800;margin:0 0 7px 2px}
  .hand{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .market{display:flex;gap:9px;padding-left:16px;border-left:1px solid var(--line)}
  .pile{width:96px;min-width:96px;height:160px;border-radius:13px;background:repeating-linear-gradient(135deg,#2f3760 0 9px,#262d48 9px 18px);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);cursor:default;font-size:11.5px;font-weight:700;gap:5px;text-align:center;padding:6px}
  .pile.draw{outline:3px solid var(--teal);color:var(--teal);cursor:pointer}
  .pile .cnt{font-size:26px;font-weight:900;color:var(--ink)}
  .market .card.draw{outline:3px solid var(--teal);cursor:pointer}
  .card.mkt{cursor:default}

  #toasts{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none;width:min(600px,93vw)}
  .toast{width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:14px 17px;animation:pop .3s ease;transition:opacity .5s}
  .toast.bridge{border-color:var(--bridge);box-shadow:0 0 36px rgba(102,217,255,.3)}
  .toast.bond{border-color:var(--bond)}
  .toast .head{display:flex;align-items:center;gap:10px;font-weight:900;font-size:15px}
  .toast .head .tag{font-size:11.5px;letter-spacing:1px;padding:3px 9px;border-radius:20px;text-transform:uppercase}
  .toast.bridge .tag{background:var(--bridge);color:#05242f}
  .toast.bond .tag{background:var(--bond);color:#3d1707}
  .toast.link .tag{background:var(--panel2);color:var(--muted)}
  .toast .pts{margin-left:auto;font-size:26px;font-weight:900;color:var(--gold)}
  .toast .who{font-size:14px;margin-top:7px;line-height:1.45}
  .toast .why{font-size:12.5px;margin-top:5px;color:var(--muted);line-height:1.45}
  .toast .math{font-size:11px;margin-top:7px;color:var(--faint);font-weight:700}
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}

  .modal-bg{position:fixed;inset:0;background:rgba(6,8,15,.76);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:var(--bg2);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:28px}
  .modal h2{margin:0 0 6px;font-size:26px}
  .modal h2 b{color:var(--gold)}
  .modal .sub{color:var(--muted);margin:0 0 20px;font-size:14.5px;line-height:1.5}
  .modal p{font-size:14.5px;line-height:1.65}
  .step{display:flex;gap:14px;align-items:flex-start;margin:14px 0}
  .step .num{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#2a2005;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
  .step .txt{font-size:14.5px;line-height:1.5;padding-top:5px}
  .step .txt b{color:var(--teal)}
  .modal .big{font-size:60px;font-weight:900;color:var(--gold);text-align:center;line-height:1}
  .modal .bigl{text-align:center;color:var(--faint);text-transform:uppercase;letter-spacing:2px;font-size:11.5px;font-weight:800;margin-bottom:16px}
  .reflect{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin:11px 0}
  .reflect .r-tag{font-size:10.5px;color:var(--bridge);letter-spacing:1px;text-transform:uppercase;font-weight:800}
  .reflect .r-who{font-size:15px;font-weight:800;margin:4px 0}
  .reflect .r-why{font-size:13px;color:var(--muted);line-height:1.5}
  .modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
  .synthnote{font-size:12px;color:var(--faint);border-top:1px solid var(--line);margin-top:18px;padding-top:12px;line-height:1.55}
  .modeswitch{display:flex;gap:0;border:1.5px solid var(--line);border-radius:11px;overflow:hidden}
  .modeswitch button{border-radius:0;background:transparent;color:var(--faint);padding:9px 13px;font-size:12.5px;min-height:40px}
  .modeswitch button.on{background:var(--panel2);color:var(--ink)}
</style>
</head>
<body>
<header>
  <div class="logo">VALUE <b>CHAIN</b><small id="mode-label">Free play</small></div>
  <div class="stats">
    <div class="stat"><div class="n" id="s-score">0</div><div class="l">Points</div></div>
    <div class="stat"><div class="n" id="s-bridges">0</div><div class="l">Bridges</div></div>
    <div class="stat"><div class="n" id="s-pile">0</div><div class="l">Cards left</div></div>
  </div>
  <div class="spacer"></div>
  <div class="modeswitch">
    <button id="m-free" class="on">Free play</button>
    <button id="m-daily">Today's deck</button>
  </div>
  <button class="btn-ghost" id="btn-help">How to play</button>
  <button class="btn-ghost" id="btn-finish">See results</button>
  <button class="btn-gold" id="btn-new">New game</button>
</header>

<div class="layout">
  <div class="board-wrap">
    <div class="coach" id="coach"></div>
    <div class="chains" id="chains"></div>
  </div>
  <aside class="side" id="side"></aside>
</div>

<div class="tray">
  <div class="row">
    <div>
      <div class="label">Your cards</div>
      <div class="hand" id="hand"></div>
    </div>
    <div>
      <div class="label">Pick up a new card</div>
      <div class="market" id="market"></div>
    </div>
  </div>
</div>

<div id="toasts"></div>
<div id="modal-root"></div>

<script>
/* ============================================================================
   VALUE CHAIN — playable prototype (target age 10+)
   ----------------------------------------------------------------------------
   THE DATA IS SYNTHETIC, and labelled as such in-game. Its STRUCTURE mirrors the
   World Values Survey:
     · "zones" are placed per the Inglehart-Welzel cultural map
     · people are built from real WVS metadata axes (country, age, settlement
       size, education, gender, occupation category)
     · each question's "heat" mirrors how divided the world really is on it
   ANTI-STEREOTYPE POLICY (see DESIGN.md §11):
     · every card is a named individual with an age and a job, not a national
       archetype ("Italian nonna", "Japanese salaryman") and no food/dress cliches
     · most countries appear 2-3 times with genuinely DIFFERENT value profiles,
       so the deck itself teaches that a country is not a monolith
     · icons describe the person's WORK, never their nationality
   ============================================================================ */

/* ---- 14 questions. Age-appropriate wordings of real WVS-style items.
        pts = how divided the world is (1 = almost everyone agrees, 6 = big split) ---- */
const DIMS = [
  {id:'lgbt',   q:'Same-sex couples should be accepted',            short:'Accepting same-sex couples', pts:6},
  {id:'religion',q:'Religion is a big part of my life',             short:'Religion',                   pts:5},
  {id:'divorce',q:"Divorce is OK if a marriage isn't working",      short:'Divorce',                    pts:5},
  {id:'immig',  q:'People moving here from other countries make it better', short:'Newcomers',          pts:5},
  {id:'gender', q:'Girls and boys should get exactly the same chances', short:'Equal chances',          pts:4},
  {id:'obey',   q:'Children should always obey their parents',      short:'Obeying parents',            pts:4},
  {id:'nation', q:"I'm very proud of my country",                   short:'Country pride',              pts:4},
  {id:'author', q:'We should show more respect for people in charge',short:'Respect for leaders',       pts:3},
  {id:'trust',  q:'Most people can be trusted',                     short:'Trusting others',            pts:3},
  {id:'environ',q:'Protecting nature matters more than making money',short:'Protecting nature',         pts:3},
  {id:'democ',  q:'Everyone should have a say in how the country is run', short:'Everyone gets a say',  pts:2},
  {id:'work',   q:'Working hard is how you get ahead in life',      short:'Hard work',                  pts:2},
  {id:'help',   q:'We should help people in other countries',       short:'Helping other countries',    pts:2},
  {id:'family', q:'Family comes first',                             short:'Family first',               pts:1},
];
const DI = Object.fromEntries(DIMS.map((d,i)=>[d.id,i]));

/* ---- cultural zones, positioned per the Inglehart-Welzel map ---- */
const ZONES = {
  nordic:{name:'Northern Europe', color:'z-nordic',v:{lgbt:88,religion:20,divorce:85,immig:65,gender:92,obey:25,nation:45,author:30,trust:68,environ:78,democ:88,work:40,help:78,family:82}},
  anglo: {name:'English-speaking',color:'z-anglo', v:{lgbt:68,religion:60,divorce:70,immig:55,gender:82,obey:45,nation:78,author:55,trust:42,environ:52,democ:80,work:80,help:55,family:85}},
  latin: {name:'Latin America',   color:'z-latin', v:{lgbt:58,religion:68,divorce:62,immig:50,gender:72,obey:55,nation:72,author:55,trust:25,environ:62,democ:68,work:70,help:52,family:92}},
  cath:  {name:'Southern Europe', color:'z-cath',  v:{lgbt:74,religion:45,divorce:72,immig:52,gender:84,obey:40,nation:55,author:45,trust:42,environ:68,democ:82,work:55,help:62,family:88}},
  orth:  {name:'Eastern Europe',  color:'z-orth',  v:{lgbt:22,religion:55,divorce:62,immig:34,gender:64,obey:56,nation:72,author:64,trust:30,environ:48,democ:54,work:55,help:40,family:86}},
  afrme: {name:'Africa & Mid-East',color:'z-afrme',v:{lgbt:6, religion:95,divorce:28,immig:40,gender:38,obey:80,nation:84,author:80,trust:22,environ:55,democ:60,work:74,help:55,family:95}},
  conf:  {name:'East Asia',       color:'z-conf',  v:{lgbt:44,religion:25,divorce:55,immig:36,gender:62,obey:56,nation:64,author:62,trust:46,environ:58,democ:56,work:80,help:45,family:84}},
  sasia: {name:'South Asia',      color:'z-sasia', v:{lgbt:26,religion:88,divorce:40,immig:42,gender:52,obey:74,nation:82,author:74,trust:30,environ:60,democ:66,work:82,help:48,family:94}},
};
(function(){ /* the world-average zone, for the broad "huge group" cards */
  const acc={}; DIMS.forEach(d=>acc[d.id]=0);
  const zs=Object.values(ZONES); zs.forEach(z=>DIMS.forEach(d=>acc[d.id]+=z.v[d.id]));
  const v={}; DIMS.forEach(d=>v[d.id]=Math.round(acc[d.id]/zs.length));
  ZONES.global={name:'Everywhere',color:'z-global',v};
})();

/* ---- life-situation modifiers: the real WVS metadata axes, as deltas ---- */
const MODS = {
  youngUrbanGrad:{religion:-16,lgbt:20,divorce:12,gender:12,immig:12,obey:-16,author:-12,nation:-8,trust:4,environ:12,democ:4,work:-6,help:8,family:-4},
  olderRural:    {religion:12,lgbt:-16,divorce:-10,gender:-12,immig:-10,obey:16,author:12,nation:8,trust:-2,environ:-4,democ:-4,work:4,help:-6,family:4},
  military:      {nation:18,author:20,obey:12,work:8,gender:-8,immig:-8,lgbt:-8,trust:-6},
  women:         {gender:9,environ:6,nation:-6,author:-5,work:-4,lgbt:3,help:5},
  business:      {work:12,environ:-10,trust:8,author:6,immig:5,democ:-2},
  care:          {environ:8,gender:8,trust:8,author:-6,lgbt:5,work:-6,help:10},
  farming:       {religion:7,obey:8,environ:-6,trust:-5,author:6,work:4,immig:-5},
  student:       {democ:6,environ:8,lgbt:8,obey:-10,work:-8,help:6},

/* ============================ ENGINE ============================ */
const clamp=(x)=>Math.max(0,Math.min(100,x));
PEOPLE.forEach(p=>{
  const base=ZONES[p.zone].v; const v={};
  DIMS.forEach(d=>{ let x=base[d.id]; p.mods.forEach(m=>{ if(MODS[m]&&MODS[m][d.id]!=null) x+=MODS[m][d.id]; }); v[d.id]=clamp(Math.round(x)); });
  p.v=v; p.zoneName=ZONES[p.zone].name; p.zoneColor=ZONES[p.zone].color;
});

function distance(a,b){ let s=0; DIMS.forEach(d=>{const g=a.v[d.id]-b.v[d.id]; s+=g*g;}); return Math.sqrt(s/DIMS.length); }
/* Tolerance GROWS with how different two people are. Two near-identical people must match
   closely (so they share only a few things and the choice still matters); two very different
   people count a rough alignment as real common ground — otherwise the most valuable
   connections in the game would be literally impossible to make. */
function tolerance(a,b,dist){
  const d = dist!=null? dist : distance(a,b);
  return 8 + d*0.22 + (a.breadth-1)*1.2 + (b.breadth-1)*1.2;
}
function agreesOn(a,b,dimId,dist){ return Math.abs(a.v[dimId]-b.v[dimId]) <= tolerance(a,b,dist); }
/* plain-language stance, so a 10-year-old can read a card instantly */
function stance(val){ return val>=60?'yes':(val<=40?'no':'mixed'); }
function stanceWord(val){ return val>=60?'YES':(val<=40?'NO':'NOT SURE'); }

/* Scoring is small whole numbers you can add in your head. Max ~17. */
function scoreLink(a,b,dimId){
  const dim=DIMS[DI[dimId]];
  const topic=dim.pts;                                  // 1..6  how divided the world is
  const dist=distance(a,b);                             // how different these two are
  let distBonus=0;
  if(dist>=55) distBonus=11; else if(dist>=45) distBonus=8;
  else if(dist>=35) distBonus=5; else if(dist>=25) distBonus=3; else if(dist>=15) distBonus=1;
  const bothNiche=a.breadth<=2&&b.breadth<=2;
  const specBonus=bothNiche?2:((a.breadth<=2||b.breadth<=2)?1:0);
  const gap=Math.abs(a.v[dimId]-b.v[dimId]);
  const tightBonus=(gap<=4&&bothNiche)?2:0;
  let kind='link';
  if(dist>=45) kind='bridge'; else if(tightBonus) kind='bond';
  return {total:topic+distBonus+specBonus+tightBonus,topic,distBonus,specBonus,tightBonus,
          dist:Math.round(dist),kind,dimId,gap};
}

/* ============================ STATE ============================ */
let S, MODE='free';
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function todaySeed(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
function shuffle(a,rng){ for(let i=a.length-1;i>0;i--){const j=Math.floor((rng?rng():Math.random())*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function newGame(){
  const rng = MODE==='daily'? mulberry32(todaySeed()) : null;
  /* every card is a different person — no duplicates, which would just look like a bug.
     Each game uses a random subset, so no two games play the same. */
  const deck=shuffle(PEOPLE.slice(),rng).slice(0,32);
  S={deck,hand:[],market:[],chains:[],score:0,links:0,bridges:0,log:[],selected:null,phase:'select'};
  for(let i=0;i<7;i++) S.hand.push(S.deck.pop());
  for(let i=0;i<3;i++) if(S.deck.length) S.market.push(S.deck.pop());
  closePicker(); closeModal(); render(); renderSide(null);
}

function endDimTail(ch){ return ch.links.length? ch.links[ch.links.length-1].dimId : null; }
function endDimHead(ch){ return ch.links.length? ch.links[0].dimId : null; }
function validDims(a,b,excl){
  return DIMS.filter(d=>d.id!==excl && agreesOn(a,b,d.id)).map(d=>scoreLink(a,b,d.id)).sort((x,y)=>y.total-x.total);
}
function placementsFor(card){
  const res={tails:[],heads:[]};
  S.chains.forEach((ch,ci)=>{
    const t=validDims(ch.nodes[ch.nodes.length-1],card,endDimTail(ch)); if(t.length) res.tails.push({ci,best:t[0].total});
    const h=validDims(ch.nodes[0],card,endDimHead(ch));                 if(h.length) res.heads.push({ci,best:h[0].total});
  });
  return res;
}

/* ============================ ACTIONS ============================ */
function selectHand(i){ if(S.phase!=='select')return; S.selected=(S.selected===i)?null:i; render(); }
function startNewChain(){
  if(S.phase!=='select'||S.selected==null)return;
  S.chains.push({nodes:[S.hand[S.selected]],links:[]});
  S.hand.splice(S.selected,1); S.selected=null; enterRefill();
}
function placeOnChain(ci,end,dimId){
  const card=S.hand[S.selected], ch=S.chains[ci];
  const anchor = end==='tail'? ch.nodes[ch.nodes.length-1] : ch.nodes[0];
  const sc=scoreLink(anchor,card,dimId);
  if(end==='tail'){ ch.nodes.push(card); ch.links.push({dimId,score:sc.total,kind:sc.kind}); }
  else            { ch.nodes.unshift(card); ch.links.unshift({dimId,score:sc.total,kind:sc.kind}); }
  S.score+=sc.total; S.links++; if(sc.kind==='bridge') S.bridges++;
  S.log.push({a:anchor,b:card,sc}); showToast(anchor,card,sc);
  S.hand.splice(S.selected,1); S.selected=null; closePicker(); enterRefill();
}
function enterRefill(){
  if(!S.deck.length && !S.market.length){ S.phase='select'; render(); return; }
  S.phase='refill'; render();
}
function drawFrom(src,mi){
  if(S.phase!=='refill')return;
  let c=null;
  if(src==='pile'){ if(S.deck.length) c=S.deck.pop(); }
  else { c=S.market[mi]; S.market.splice(mi,1); if(S.deck.length) S.market.push(S.deck.pop()); }
  if(c) S.hand.push(c);
  S.phase='select'; render();
}
function swapSelected(){
  if(S.phase!=='select'||S.selected==null)return;
  S.hand.splice(S.selected,1); S.selected=null; enterRefill();
}

/* ============================ RENDER ============================ */
const el=id=>document.getElementById(id);
function render(){
  el('s-score').textContent=S.score; el('s-bridges').textContent=S.bridges; el('s-pile').textContent=S.deck.length;
  renderCoach(); renderChains(); renderHand(); renderMarket();
}
function renderCoach(){
  const c=el('coach');
  if(S.phase==='refill'){ c.innerHTML='<span class="ico">🎴</span><div>Nice! Now <b>pick up a new card</b> — choose one you can see, or take a mystery card from the pile.</div>'; return; }
  if(!S.chains.length && S.selected==null){ c.innerHTML='<span class="ico">👋</span><div>Tap a person at the bottom to <b>pick them up</b>. Then put them on the board to start.</div>'; return; }
  if(S.selected==null){ c.innerHTML='<span class="ico">🔍</span><div>Tap someone in your cards. You\'ll see <b>glowing spots</b> where they agree with a person already on the board.</div>'; return; }
  const card=S.hand[S.selected], pl=placementsFor(card), n=pl.tails.length+pl.heads.length;
  c.innerHTML = n
    ? `<span class="ico">✨</span><div><b>${card.name}</b> fits in ${n} glowing spot${n>1?'s':''}! Tap one to see what they agree about. <b>Rarer agreements are worth more points.</b></div>`
    : `<span class="ico">🤔</span><div><b>${card.name}</b> doesn't agree with anyone on the ends right now. Start a <b>new chain</b>, or swap this card for a different one.</div>`;
}
function cardHTML(p,cls=''){
  const zc=`var(--${p.zoneColor})`;
  const huge=p.breadth>=4;
  const tag=huge?'<div class="grouptag huge">A huge group</div>':'<div class="grouptag">One kind of person</div>';
  return `<div class="card ${cls}" style="border-left-color:${zc}">
    <div class="top"><div class="job-ico">${p.ico}</div><div style="font-size:19px">${p.flag}</div></div>
    <div class="who">${p.name}${p.age?` <span>${p.age}</span>`:''}</div>
    <div class="place">${p.place}</div>
    <div class="job">${p.job}</div>
    ${tag}
    <div class="sig">${sigLine(p)}</div>
  </div>`;
}
function sigLine(p){
  /* An answer that sets this person apart from the world average. We pick from their top 3
     most-distinctive answers (deterministically, by name) rather than always the single
     biggest — otherwise almost every card in the deck shows the same topic. */
  const g=ZONES.global.v;
  const ranked=DIMS.slice().sort((a,b)=>Math.abs(p.v[b.id]-g[b.id])-Math.abs(p.v[a.id]-g[a.id])).slice(0,3);
  let h=0; for(const ch of p.id) h=(h*31+ch.charCodeAt(0))>>>0;
  const d=ranked[h%ranked.length];
  return `Says <b>${stanceWord(p.v[d.id])}</b> to<br>“${d.short}”`;
}
function renderChains(){
  const wrap=el('chains'); wrap.innerHTML='';
  const card=S.selected!=null?S.hand[S.selected]:null;
  const pl=card?placementsFor(card):{tails:[],heads:[]};
  const can=S.phase==='select'&&card;

  S.chains.forEach((ch,ci)=>{
    const row=document.createElement('div'); row.className='chain';
    const hp=pl.heads.find(x=>x.ci===ci); if(can&&hp) row.appendChild(slotEl(ci,'head',hp.best));
    ch.nodes.forEach((node,ni)=>{
      const d=document.createElement('div'); d.innerHTML=cardHTML(node); const c=d.firstElementChild;
      c.addEventListener('mouseenter',()=>renderSide(node)); c.addEventListener('click',()=>renderSide(node));
      row.appendChild(c);
      if(ni<ch.links.length) row.appendChild(linkEl(ch.links[ni]));
    });
    const tp=pl.tails.find(x=>x.ci===ci); if(can&&tp) row.appendChild(slotEl(ci,'tail',tp.best));
    wrap.appendChild(row);
  });

  const holder=document.createElement('div'); holder.className='chain'; holder.style.cssText='border:none;background:none;min-height:0;padding-left:0';
  const nc=document.createElement('div'); nc.className='newchain'+(can?' active':'');
  nc.innerHTML=`<div class="plus">＋</div><div>${can?'Start a new chain<br>with '+S.hand[S.selected].name:'New chain'}</div>`;
  if(can) nc.addEventListener('click',startNewChain);
  holder.appendChild(nc); wrap.appendChild(holder);
}
function slotEl(ci,end,best){
  const s=document.createElement('div'); s.className='slot';
  s.innerHTML=`<div class="plus">＋</div><div>they agree!</div><div class="best">up to +${best}</div>`;
  s.addEventListener('click',e=>openPicker(ci,end,e.currentTarget));
  return s;
}
function linkEl(l){
  const d=DIMS[DI[l.dimId]];
  const w=document.createElement('div'); w.className='link '+(l.kind==='bridge'?'bridge':l.kind==='bond'?'bond':'');
  w.innerHTML=`<div class="wire"></div><div class="chip"><div class="d">${d.short}</div><div class="p">+${l.score}</div></div><div class="wire"></div>`;
  return w;
}
function renderHand(){
  const h=el('hand'); h.innerHTML='';
  S.hand.forEach((p,i)=>{
    let cls='in-hand'+(S.selected===i?' selected':'')+(S.phase==='refill'?' dim':'');
    const d=document.createElement('div'); d.innerHTML=cardHTML(p,cls); const c=d.firstElementChild;
    c.addEventListener('click',()=>{ if(S.phase==='select'){selectHand(i);renderSide(p);} });
    c.addEventListener('mouseenter',()=>renderSide(p));
    h.appendChild(c);
  });
  if(S.phase==='select'&&S.selected!=null){
    const b=document.createElement('button'); b.className='btn-ghost'; b.style.alignSelf='center';
    b.textContent='Swap this card'; b.onclick=swapSelected; h.appendChild(b);
  }
  if(!S.hand.length) h.innerHTML='<div style="color:var(--faint);font-size:14px;padding:24px">No cards left — tap <b>See results</b>.</div>';
}
function renderMarket(){
  const m=el('market'); m.innerHTML='';
  const drawing=S.phase==='refill';
  const pile=document.createElement('div'); pile.className='pile'+(drawing&&S.deck.length?' draw':'');
  pile.innerHTML=`<div class="cnt">${S.deck.length}</div>${drawing?'tap for a<br>mystery card':'mystery pile'}`;
  if(drawing&&S.deck.length) pile.addEventListener('click',()=>drawFrom('pile'));
  m.appendChild(pile);
  S.market.forEach((p,i)=>{
    const d=document.createElement('div'); d.innerHTML=cardHTML(p,'mkt'+(drawing?' draw':'')); const c=d.firstElementChild;
    c.addEventListener('mouseenter',()=>renderSide(p));
    if(drawing) c.addEventListener('click',()=>drawFrom('market',i));
    m.appendChild(c);
  });
}
let showAll=false;
function renderSide(p){
  const s=el('side');
  if(!p){ s.innerHTML='<div class="empty">👋 Tap any person to see what they believe.<br><br>Every card is a made-up person, but their answers are based on how real people around the world answered a huge survey.</div>'; return; }
  const yes=DIMS.filter(d=>p.v[d.id]>=62).sort((a,b)=>p.v[b.id]-p.v[a.id]).slice(0,4);
  const no =DIMS.filter(d=>p.v[d.id]<=38).sort((a,b)=>p.v[a.id]-p.v[b.id]).slice(0,4);
  const bars=DIMS.map(d=>{
    const hot=d.pts>=5?'<span class="hot">world is split</span>':(d.pts<=1?'<span class="warm">nearly everyone agrees</span>':'');
    return `<div class="stancebar"><div class="top"><span class="lab">${d.q}${hot}</span><span class="val">${stanceWord(p.v[d.id])}</span></div>
      <div class="track"><div class="fill" style="width:${p.v[d.id]}%"></div></div></div>`;
  }).join('');
  s.innerHTML=`<h3 class="p-head">${p.ico} ${p.name}${p.age?` <span>· ${p.age}</span>`:''}</h3>
    <div class="p-sub">${p.flag} ${p.place}<br>${p.job}</div>
    <div class="zone-tag">${p.breadth>=4?'A huge group of people':'One specific kind of person'}</div>
    <div class="grp"><h5>They say YES to</h5>${yes.map(d=>`<div class="item"><i>✅</i><span>${d.q}</span></div>`).join('')||'<div class="item"><i>—</i><span>Nothing strongly</span></div>'}</div>
    <div class="grp"><h5>They say NO to</h5>${no.map(d=>`<div class="item"><i>❌</i><span>${d.q}</span></div>`).join('')||'<div class="item"><i>—</i><span>Nothing strongly</span></div>'}</div>
    <button class="btn-ghost allbtn" onclick="showAll=!showAll;renderSide(window.__last)">${showAll?'Hide':'See'} all 14 answers</button>
    ${showAll?`<div style="margin-top:12px">${bars}</div>`:''}
    <div class="synthnote">${p.name} is made up — but built from the kinds of answers real people with this age, home and job gave in a worldwide survey.</div>`;
  window.__last=p;
}

let pickerEl=null;
function openPicker(ci,end,anchorNode){
  closePicker();
  const card=S.hand[S.selected], ch=S.chains[ci];
  const anchor= end==='tail'? ch.nodes[ch.nodes.length-1] : ch.nodes[0];
  const opts=validDims(anchor,card, end==='tail'?endDimTail(ch):endDimHead(ch));
  if(opts.length===1){ placeOnChain(ci,end,opts[0].dimId); return; }
  const pk=document.createElement('div'); pk.className='picker';
  pk.innerHTML=`<h4>What do ${anchor.name} and ${card.name} agree about?<small>Pick one. Rarer agreements score more.</small></h4>`;
  opts.forEach(o=>{
    const d=DIMS[DI[o.dimId]];
    const both=stanceWord(anchor.v[o.dimId])===stanceWord(card.v[o.dimId])
      ? `Both say ${stanceWord(anchor.v[o.dimId])}` : 'They feel about the same';
    const extra = o.kind==='bridge'?' · 🌉 very different people!' : (o.kind==='bond'?' · 🤝 they really match':'');
    const row=document.createElement('div'); row.className='opt '+(o.kind==='bridge'?'bridge':o.kind==='bond'?'bond':'');
    row.innerHTML=`<div class="dn">${d.q}<small>${both}${extra}</small></div><div class="pv">+${o.total}</div>`;
    row.addEventListener('click',()=>placeOnChain(ci,end,o.dimId));
    pk.appendChild(row);
  });
  document.body.appendChild(pk); pickerEl=pk;
  const r=anchorNode.getBoundingClientRect();
  pk.style.left=Math.max(8,Math.min(r.left-60,window.innerWidth-350))+'px';
  pk.style.top = (r.top-8-pk.offsetHeight < 70) ? (r.bottom+8)+'px' : (r.top-8-pk.offsetHeight)+'px';
}
function closePicker(){ if(pickerEl){pickerEl.remove();pickerEl=null;} }
document.addEventListener('click',e=>{ if(pickerEl&&!pickerEl.contains(e.target)&&!e.target.closest('.slot')) closePicker(); });

function showToast(a,b,sc){
  const d=DIMS[DI[sc.dimId]];
  const tag=sc.kind==='bridge'?'🌉 Bridge!':sc.kind==='bond'?'🤝 Great match':'✅ Connected';
  const t=document.createElement('div'); t.className='toast '+sc.kind;
  const both=stanceWord(a.v[sc.dimId])===stanceWord(b.v[sc.dimId])?`both say <b>${stanceWord(a.v[sc.dimId])}</b>`:'feel about the same';
  const why= sc.kind==='bridge'
    ? `These two live very different lives and disagree about almost everything else — but here they think the same. That's what this game is looking for.`
    : sc.kind==='bond' ? `They see eye to eye on this one, almost exactly.` : `A real thing these two agree on.`;
  const bits=[`topic +${sc.topic}`]; if(sc.distBonus)bits.push(`different lives +${sc.distBonus}`);
  if(sc.specBonus)bits.push(`specific people +${sc.specBonus}`); if(sc.tightBonus)bits.push(`perfect match +${sc.tightBonus}`);
  t.innerHTML=`<div class="head"><span class="tag">${tag}</span><span>“${d.q}”</span><span class="pts">+${sc.total}</span></div>
    <div class="who">${a.flag} <b>${a.name}</b> and ${b.flag} <b>${b.name}</b> ${both}</div>
    <div class="why">${why}</div><div class="math">${bits.join('  ·  ')}</div>`;
  el('toasts').appendChild(t);
  setTimeout(()=>t.style.opacity='0',3600); setTimeout(()=>t.remove(),4150);
}

/* ============================ MODALS ============================ */
function closeModal(){ el('modal-root').innerHTML=''; }
function helpModal(){
  el('modal-root').innerHTML=`<div class="modal-bg"><div class="modal">
    <h2>How to play <b>Value Chain</b></h2>
    <p class="sub">People all over the world were asked the same questions. Your job: find the people who agree — especially when you'd never expect it.</p>
    <div class="step"><div class="num">1</div><div class="txt">Tap a person in <b>your cards</b> at the bottom.</div></div>
    <div class="step"><div class="num">2</div><div class="txt">Put them on the board. The first person starts a <b>chain</b>.</div></div>
    <div class="step"><div class="num">3</div><div class="txt">Pick another person. <b>Glowing spots</b> show where they agree with someone already on the board.</div></div>
    <div class="step"><div class="num">4</div><div class="txt">Choose <b>what</b> they agree about. This is the real choice — some agreements are worth way more than others.</div></div>
    <div class="step"><div class="num">5</div><div class="txt">Then <b>pick up a new card</b> and keep going!</div></div>
    <p style="margin-top:20px"><b>How to score big 🌉</b></p>
    <ul style="font-size:14.5px;line-height:1.7;color:var(--muted)">
      <li>Agreeing that <i>“family comes first”</i> is worth almost nothing — nearly everyone on Earth says yes.</li>
      <li>Agreeing about something the world is <b>split</b> on is worth a lot.</li>
      <li>The biggest points: two people whose lives are <b>completely different</b> who still agree. That's a <b>Bridge</b>.</li>
    </ul>
    <p class="synthnote">These people are made up, but their answers are built from how real people around the world answered a huge survey called the World Values Survey.</p>
    <div class="actions"><button class="btn-gold" onclick="closeModal()">Let's play!</button></div>
  </div></div>`;
}
function finishModal(){
  const br=S.log.filter(x=>x.sc.kind==='bridge').sort((a,b)=>b.sc.total-a.sc.total).slice(0,3);
  const longest=S.chains.reduce((m,c)=>Math.max(m,c.nodes.length),0);
  const key='vc_best_'+(MODE==='daily'?todaySeed():'free');
  const prev=+(localStorage.getItem(key)||0); const best=Math.max(prev,S.score);
  localStorage.setItem(key,best);
  const list= br.length? br.map(x=>{
    const d=DIMS[DI[x.sc.dimId]];
    return `<div class="reflect"><div class="r-tag">🌉 Bridge · +${x.sc.total} points</div>
      <div class="r-who">${x.a.flag} ${x.a.name} &nbsp;+&nbsp; ${x.b.flag} ${x.b.name}</div>
      <div class="r-why">${x.a.job} in ${x.a.place}. ${x.b.job} in ${x.b.place}.<br>
      They both answered the same way to <b>“${d.q}”</b>.</div></div>`; }).join('')
    : `<div class="reflect"><div class="r-why">You didn't find a Bridge this time. Try connecting people from <b>very different places and ages</b> — that's where the biggest points hide.</div></div>`;
  el('modal-root').innerHTML=`<div class="modal-bg"><div class="modal">
    <div class="bigl">Your score</div><div class="big">${S.score}</div>
    <p class="sub" style="text-align:center">${S.links} connections · ${S.bridges} bridges · longest chain ${longest} people${best>S.score?` · your best: ${best}`:(best===S.score&&prev?' · new best! 🎉':'')}</p>
    <h2 style="font-size:18px;margin-top:22px">The surprising matches you found</h2>
    ${list}
    <p style="color:var(--muted);font-size:13.5px;margin-top:14px">Every bridge above is a place where two people who live totally different lives quietly believe the same thing. There are a lot more of those in the real world than most people expect.</p>
    <div class="actions"><button class="btn-ghost" onclick="closeModal()">Keep playing</button>
      <button class="btn-gold" onclick="newGame()">New game</button></div>
  </div></div>`;
}

/* ============================ WIRE UP ============================ */
el('btn-help').onclick=helpModal;
el('btn-finish').onclick=finishModal;
el('btn-new').onclick=newGame;
el('m-free').onclick=()=>{MODE='free';el('m-free').classList.add('on');el('m-daily').classList.remove('on');el('mode-label').textContent='Free play';newGame();};
el('m-daily').onclick=()=>{MODE='daily';el('m-daily').classList.add('on');el('m-free').classList.remove('on');el('mode-label').textContent="Today's deck · same for everyone";newGame();};
newGame();
if(!localStorage.getItem('vc_seen')){ helpModal(); localStorage.setItem('vc_seen','1'); }
</script>
</body>
